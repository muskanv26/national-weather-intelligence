spring.application.name=national-weather-intelligence

# Database Configuration with Environment Variable Placeholders
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/national_weather_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Kafka Configuration with Environment Variable Placeholders
spring.kafka.enabled=${KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic.weather-events=${KAFKA_WEATHER_TOPIC:weather-events}
kafka.topic.citizen-reports=${KAFKA_CITIZEN_TOPIC:citizen-reports}
kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:weather-intelligence-group}

# Google Gemini (Generative Language API)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.7-flash}
gemini.api.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.6-flash,gemini-flash-latest,gemini-2.5-flash}
gemini.api.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:5000}
gemini.api.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:20000}


